<svg width="1400" height="320" viewBox="0 0 1400 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1128"/>
      <stop offset="55%" stop-color="#0F1C3F"/>
      <stop offset="100%" stop-color="#1B0F2E"/>
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF69B4"/>
      <stop offset="50%" stop-color="#EF93C4"/>
      <stop offset="100%" stop-color="#F8BBD0"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FF69B4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FF69B4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="10%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#EF93C4" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#EF93C4" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1400" height="320" fill="url(#bgGrad)"/>
  <rect width="1400" height="320" fill="url(#glow)"/>
  <rect width="1400" height="320" fill="url(#glow2)"/>

  <!-- Subtle network / circuit lines -->
  <g stroke="#FF69B4" stroke-opacity="0.22" stroke-width="1.2" fill="none">
    <line x1="900" y1="40" x2="1020" y2="90"/>
    <line x1="1020" y1="90" x2="1150" y2="60"/>
    <line x1="1020" y1="90" x2="1080" y2="180"/>
    <line x1="1080" y1="180" x2="1220" y2="200"/>
    <line x1="1220" y1="200" x2="1340" y2="150"/>
    <line x1="1080" y1="180" x2="960" y2="240"/>
    <line x1="960" y1="240" x2="1050" y2="290"/>
    <line x1="1150" y1="60" x2="1280" y2="30"/>
    <line x1="1280" y1="30" x2="1360" y2="90"/>
    <line x1="1220" y1="200" x2="1300" y2="270"/>
    <line x1="60" y1="260" x2="150" y2="220"/>
    <line x1="150" y1="220" x2="140" y2="120"/>
    <line x1="150" y1="220" x2="260" y2="260"/>
    <line x1="140" y1="120" x2="230" y2="70"/>
    <line x1="40" y1="60" x2="140" y2="120"/>
  </g>
  <g fill="#F8BBD0" fill-opacity="0.55">
    <circle cx="900" cy="40" r="3.5"/>
    <circle cx="1020" cy="90" r="4.5"/>
    <circle cx="1150" cy="60" r="3.5"/>
    <circle cx="1080" cy="180" r="4.5"/>
    <circle cx="1220" cy="200" r="3.5"/>
    <circle cx="1340" cy="150" r="3.5"/>
    <circle cx="960" cy="240" r="3.5"/>
    <circle cx="1050" cy="290" r="3"/>
    <circle cx="1280" cy="30" r="3"/>
    <circle cx="1360" cy="90" r="3"/>
    <circle cx="1300" cy="270" r="3"/>
    <circle cx="60" cy="260" r="3.5"/>
    <circle cx="150" cy="220" r="4.5"/>
    <circle cx="140" cy="120" r="3.5"/>
    <circle cx="260" cy="260" r="3"/>
    <circle cx="230" cy="70" r="3"/>
    <circle cx="40" cy="60" r="3"/>
  </g>

  <!-- Accent line above title -->
  <rect x="100" y="108" width="70" height="4" rx="2" fill="url(#pinkGrad)"/>

  <!-- Name -->
  <text x="100" y="175" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="58" font-weight="700" fill="#FFFFFF" filter="url(#softGlow)">
    Nolwazi Ntuli
  </text>

  <!-- Subtitle -->
  <text x="102" y="215" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="500" letter-spacing="1.5" fill="url(#pinkGrad)">
    AI DEVELOPER &#160;&#8226;&#160; .NET &#160;&#8226;&#160; AZURE &#160;&#8226;&#160; BUSINESS TECHNOLOGY
  </text>

  <!-- Tagline -->
  <text x="102" y="250" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#C9CEE8" fill-opacity="0.8">
    Building intelligent business solutions at the intersection of strategy and software
  </text>
</svg>
